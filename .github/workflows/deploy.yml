name: Deploy

# On every push to main: install, build, and publish the built theme to the
# `deploy` branch in the layout Pressable's wp-content git integration expects
# (wp-content/themes/citcom-rebuild/...). The branch always holds a single commit,
# force-pushed each run, so Pressable only ever sees the latest build.

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble deploy tree
        run: |
          set -euo pipefail
          DEPLOY="$RUNNER_TEMP/deploy"
          rm -rf "$DEPLOY"
          mkdir -p "$DEPLOY/wp-content/themes/citcom-rebuild"
          rsync -a \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.baseline' \
            --exclude 'docs' \
            --exclude 'tools' \
            --exclude '.github' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'webpack.config.js' \
            --exclude '.editorconfig' \
            --exclude '*.log' \
            ./ "$DEPLOY/wp-content/themes/citcom-rebuild/"
          test -f "$DEPLOY/wp-content/themes/citcom-rebuild/style.css"
          test -f "$DEPLOY/wp-content/themes/citcom-rebuild/build/theme.css"
          echo "Deploy tree:"
          find "$DEPLOY" -maxdepth 3 -not -path '*/node_modules*' | sort | head -60

      - name: Publish to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/deploy"
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: the theme's own .gitignore lists build/, which must be published here.
          git add -A -f
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy:deploy
          echo "Published $(git rev-parse --short HEAD) to deploy"
