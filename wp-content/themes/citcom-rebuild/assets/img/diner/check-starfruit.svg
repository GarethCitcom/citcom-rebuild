<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!--
    Chequerboard tile for the diner sections: two brand citdot cells per repeat, at
    (0,0) and (100,100) of a 200x200 unit, matching the layout of the design's
    400x400 pattern tile.

    Squared off to 100x100 cells (the design's are 101x100) so the unit divides
    cleanly and the strips can be sized to a whole number of cells.

    The path is the brand citdot from the clipPath in footer.php, authored in
    objectBoundingBox units, so each cell just scales it to 100x100. Fill is the
    starfruit brand colour as a literal, because CSS custom properties do not reach
    an SVG referenced as a background-image.
  -->
  <g fill="#9AD14D">
    <g transform="translate(0,0) scale(100,100)">
      <path d="M0.908,0.015 c0.052,0.011,0.081,0.041,0.085,0.115 c0.007,0.122,0.007,0.27,0.007,0.37 s0,0.248,-0.007,0.37 c-0.004,0.074,-0.033,0.104,-0.085,0.115 c-0.048,0.011,-0.254,0.015,-0.408,0.015 s-0.36,-0.004,-0.408,-0.015 C0.04,0.974,0.011,0.944,0.007,0.87 C0,0.748,0,0.6,0,0.5 S0,0.252,0.007,0.13 C0.011,0.056,0.04,0.026,0.092,0.015 C0.14,0.004,0.346,0,0.5,0 S0.86,0.004,0.908,0.015"/>
    </g>
    <g transform="translate(100,100) scale(100,100)">
      <path d="M0.908,0.015 c0.052,0.011,0.081,0.041,0.085,0.115 c0.007,0.122,0.007,0.27,0.007,0.37 s0,0.248,-0.007,0.37 c-0.004,0.074,-0.033,0.104,-0.085,0.115 c-0.048,0.011,-0.254,0.015,-0.408,0.015 s-0.36,-0.004,-0.408,-0.015 C0.04,0.974,0.011,0.944,0.007,0.87 C0,0.748,0,0.6,0,0.5 S0,0.252,0.007,0.13 C0.011,0.056,0.04,0.026,0.092,0.015 C0.14,0.004,0.346,0,0.5,0 S0.86,0.004,0.908,0.015"/>
    </g>
  </g>
</svg>
